name: Kanji N5 Artbook V2 Preview QA
on:
  push:
    paths:
      - "kanji-n5-artbook-v2*"
      - "tools/check-kanji-n5-artbook-v2.mjs"
      - ".github/workflows/kanji-n5-artbook-v2-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot-and-interaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test preview desktop and mobile
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/kanji-v2-server.log 2>&1 &
          sleep 2
          node tools/check-kanji-n5-artbook-v2.mjs
      - name: Save actual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanji-n5-artbook-v2-previews
          path: artbook-v2-screens/*.png
          if-no-files-found: warn
