name: Kanji N5 Public Preview Smoke Test
on:
  push:
    paths:
      - "kanji-n5.html"
      - "kanji-n5.css"
      - "kanji-n5.js"
      - "kanji-n5-data.js"
      - "books/n5/kanji/**"
      - "books.js"
      - "index.html"
      - ".github/workflows/kanji-n5-live.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-public-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify rendered public assets
        run: |
          BASE="https://ngocbabby.github.io/japan_study"
          for file in kanji-n5.html kanji-n5.css kanji-n5.js kanji-n5-data.js books/n5/kanji/art/cover.webp books/n5/kanji/art/gate.webp books/n5/kanji/art/story-hd.webp books.js; do
            ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              status="$(curl -sSL --max-time 25 -o /tmp/kanji-file -w "%{http_code}" "$BASE/$file")"
              echo "$file : HTTP $status (attempt $attempt)"
              if [ "$status" = "200" ]; then ok=1; break; fi
              sleep 6
            done
            test "$ok" = "1" || exit 1
          done
          # Avoid curl | grep -q: grep closes its pipe early and curl exits 23.
          curl -fsSL -o /tmp/kanji-html "$BASE/kanji-n5.html"
          curl -fsSL -o /tmp/kanji-data "$BASE/kanji-n5-data.js?v=20261103-storyhd1"
          curl -fsSL -o /tmp/kanji-js "$BASE/kanji-n5.js?v=20261103-storyhd1"
          curl -fsSL -o /tmp/kanji-books "$BASE/books.js"
          grep -Fq 'kanji-n5.js?v=20261103-storyhd1' /tmp/kanji-html
          grep -Fq '"art":"story-hd"' /tmp/kanji-data
          grep -Fq "chapters[0].art" /tmp/kanji-js
          grep -Fq 'kanji-n5.html' /tmp/kanji-books
          echo "PUBLIC KANJI N5 ORIGINAL CHAPTER ART VERIFIED"
