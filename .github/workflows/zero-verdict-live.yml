name: Zero Verdict N2 Public Website Smoke Test
on:
  push:
    branches: ["main"]
    paths:
      - "tools/check-zero-verdict-live.sh"
      - ".github/workflows/zero-verdict-live.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify all 64 chapters and N2 reader are deployed on GitHub Pages
        run: bash tools/check-zero-verdict-live.sh
