name: Build N4 Detective Novel PDF
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'n4-book.html'
      - 'n4-book.css'
      - 'n4-book.js'
      - 'n4-vocab-source.js'
      - 'n4-story-data.js'
      - 'tools/build-n4-pdf.mjs'
      - '.github/workflows/n4-book-pdf.yml'

permissions:
  contents: write

concurrency:
  group: build-n4-book
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and Japanese fonts
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Render and verify PDF
        run: node tools/build-n4-pdf.mjs
      - name: Commit and publish PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/n4/vocab/ho-so-ga-cuoi-n4.pdf
          if git diff --cached --quiet; then echo "No PDF changes"; exit 0; fi
          git commit -m "build(n4): publish complete 623-word detective novel PDF"
          git push origin HEAD:main
