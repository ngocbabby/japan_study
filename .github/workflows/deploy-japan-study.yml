name: Deploy Japan Study Website
on:
  push:
    branches: ["main"]
    paths:
      - "n3-book.html"
      - "n3-book.js"
      - "n3-book.css"
      - "n3-story-*.js"
      - "n3-source-ledger.json"
      - "books/n3/vocab/**"
      - "books.js"
      - "index.html"
      - ".github/workflows/deploy-japan-study.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
