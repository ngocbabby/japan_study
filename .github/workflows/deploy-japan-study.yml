name: Deploy Japan Study Website
on:
  push:
    branches: ["main"]
    paths:
      - "zero-verdict*"
      - "books/n2/vocab/ban-an-so-khong-deluxe.svg"
      - "books/n2/vocab/zero-scene-*.svg"
      - "seven-seas*"
      - "books/n2/vocab/hai-dang-bay-vung-bien-cam.webp"
      - "n2-novel*"
      - "books/n2/vocab/**"
      - "n3-book.html"
      - "n3-book.js"
      - "n3-book.css"
      - "n3-story-*.js"
      - "n3-source-ledger.json"
      - "books/n3/vocab/**"
      - "kanji-n5-artbook-v2*"
      - "kanji-n5-full*"
      - "kanji-n5.html"
      - "kanji-n5.css"
      - "kanji-n5.js"
      - "kanji-n5-data.js"
      - "books/n5/kanji/**"
      - "books.js"
      - "index.html"
      - ".github/workflows/deploy-japan-study.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
