name: N2 Novel Visual QA
on:
  push:
    branches: ["main"]
    paths:
      - "n2-novel*"
      - "books/n2/vocab/**"
      - "tools/check-n2-visual.mjs"
      - ".github/workflows/n2-visual-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-book:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser test desktop and mobile
        run: node tools/check-n2-visual.mjs
      - name: Archive book screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n2-visual-qa
          path: n2-visual-qa/*.png
          if-no-files-found: warn
